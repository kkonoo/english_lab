<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>잉글리시 랩</title>
  <meta name="description" content="구동사를 소리로 익히는 영어회화 공부 앱">
  <meta name="theme-color" content="#C65A3A">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">🎧 잉글리시 랩</div>
    <nav class="seg" id="tabs">
      <button data-tab="today" class="on">오늘</button>
      <button data-tab="grid">구동사</button>
      <button data-tab="idioms">표현</button>
      <button data-tab="words">단어</button>
      <button data-tab="shadow">쉐도잉</button>
    </nav>
    <div class="top-actions">
      <button class="icon-btn" id="noteBtn" title="들은 표현 적어 두기" aria-label="내 표현 추가">📝</button>
      <button class="icon-btn" id="searchBtn" title="검색 (Ctrl+K)" aria-label="검색">🔍</button>
      <button class="btn" id="accountBtn" hidden>로그인</button>
      <button class="icon-btn" id="settingsBtn" title="설정" aria-label="설정">⚙️</button>
    </div>
  </header>

  <main>
    <section id="view-today" class="view"></section>
    <section id="view-grid" class="view" hidden></section>
    <section id="view-list" class="view" hidden></section>
    <section id="view-idioms" class="view" hidden></section>
    <section id="view-words" class="view" hidden></section>
    <section id="view-shadow" class="view" hidden></section>
    <section id="view-sounds" class="view" hidden></section>
  </main>

  <dialog id="cardDlg"></dialog>

  <dialog id="searchDlg" class="search-dlg">
    <div class="search-bar">
      <input type="search" id="searchInput" placeholder="영어·뜻·한글 소리로 찾기 (예: 끊다, 피키럽, bridge)" autocomplete="off">
      <button class="icon-btn small" data-close aria-label="닫기">✕</button>
    </div>
    <div id="searchResults" class="search-results"></div>
  </dialog>

  <dialog id="noteDlg">
    <div class="panel-head">
      <h2>📝 들은 표현 적어 두기</h2>
      <button class="icon-btn small" data-close aria-label="닫기">✕</button>
    </div>
    <form id="noteForm" class="note-form">
      <input id="noteText" placeholder="들은 표현 (예: in a nutshell)" autocomplete="off" required>
      <input id="noteMemo" placeholder="메모: 어디서 들었는지, 짐작한 뜻 (선택)" autocomplete="off">
      <div id="noteFound" class="hint"></div>
      <div class="row end"><button class="btn primary">저장</button></div>
    </form>
    <p class="hint">모아 둔 표현은 표현 탭 맨 위 <b>📝 내 표현</b>에서 보고, 한꺼번에 복사해서 Claude에게 "카드로 만들어줘" 하면 돼요.</p>
  </dialog>

  <dialog id="settingsDlg">
    <div class="panel-head">
      <h2>설정</h2>
      <button class="icon-btn small" data-close aria-label="닫기">✕</button>
    </div>
    <label class="field">하루 새 카드 수
      <select id="setNew">
        <option value="5">5개</option><option value="10">10개</option>
        <option value="15">15개</option><option value="20">20개</option>
      </select>
    </label>
    <label class="field">카드 앞면
      <select id="setFront">
        <option value="sound">🎧 소리 듣고 구동사 맞히기</option>
        <option value="phrase">📇 구동사 보고 뜻 떠올리기</option>
        <option value="meaning">💬 뜻 보고 구동사 떠올리기</option>
      </select>
    </label>
    <label class="field">읽어주기 속도
      <select id="setRate">
        <option value="0.8">천천히</option><option value="1">보통</option>
        <option value="1.15">원어민처럼 빠르게</option>
      </select>
    </label>
    <label class="field">목소리
      <select id="setVoice"><option value="">기본 (미국 영어)</option></select>
    </label>
    <label class="field">글씨 크기
      <select id="setFs">
        <option value="0.9">작게</option><option value="1">보통</option>
        <option value="1.15">크게</option><option value="1.3">아주 크게</option>
      </select>
    </label>
    <label class="field">테마
      <select id="setTheme">
        <option value="">기기 설정 따르기</option><option value="light">밝게</option><option value="dark">어둡게</option>
      </select>
    </label>
    <h3>데이터</h3>
    <p class="hint">공부 기록은 이 기기에 저장돼요. 오른쪽 위에서 로그인하면 폰과 PC에서 같은 기록을 볼 수 있어요.</p>
    <div class="row">
      <button class="btn" id="exportBtn">백업 파일 저장</button>
      <label class="btn">불러오기<input type="file" id="importInput" accept="application/json" hidden></label>
      <button class="btn danger" id="resetBtn">기록 초기화</button>
    </div>
  </dialog>

  <div class="toast" id="toast" role="status"></div>

  <script src="data/core.js"></script>
  <script src="data/phrasals.js"></script>
  <script src="data/shadow.js"></script>
  <script src="data/idioms.js"></script>
  <script src="data/words.js"></script>
  <script src="js/app.js"></script>
  <script src="js/card.js"></script>
  <script src="js/today.js"></script>
  <script src="js/quiz.js"></script>
  <script src="js/grid.js"></script>
  <script src="js/list.js"></script>
  <script src="js/sounds.js"></script>
  <script src="js/shadow.js"></script>
  <script src="js/idioms.js"></script>
  <script src="js/words.js"></script>
  <script src="js/notes.js"></script>
  <script src="js/search.js"></script>
  <script type="module" src="js/sync.js"></script>
</body>
</html>
